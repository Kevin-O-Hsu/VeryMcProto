group=verymc.top
# ── 版本唯一来源（Version single source）────────────────────────────────────────
# 插件版本 = <mcVersion>-b<buildNumber>，如 1.21.11-b1；MC 改日期式命名后即 26.1-b1。
#   · mcVersion   —— 顺应的 Minecraft/Paper 上游版本；新上游版本 → 新分支 ver/<mcVersion>
#   · buildNumber —— 同一 MC 版本内的构建号（修 Bug / 版本内更新时 +1 并提交）
# Java 侧（Reference 常量、plugin.yml、协议握手字段）全部由构建注入，禁止手写版本号。
mcVersion=1.21.11
buildNumber=1
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
