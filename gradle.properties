group=verymc.top
# ── 版本唯一来源（Version single source）────────────────────────────────────────
# 插件版本 = <mcVersion>-b<buildNumber>，如 1.21.11-b1；MC 改日期式命名后即 26.1-b1。
#   · mcVersion   —— 本分支顺应的 Minecraft/Paper 上游版本：
#                    dev/main = 最新上游；ver/<X> 与 ver/<X>-dev = 冻结维护的旧上游
#   · buildNumber —— 本 MC 版本线内的构建号，在所在分支上独立 +1（发版时递增并提交）
# Java 侧（Reference 常量、plugin.yml、协议握手字段）全部由构建注入，禁止手写版本号。
mcVersion=26.1.2
buildNumber=2
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
