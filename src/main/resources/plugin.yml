name: VeryMcProto
version: '${version}'
main: verymc.top.veryMcProto.VeryMcProto
api-version: '${mcVersion}'
load: POSTWORLD
softdepend: [packetevents]
author: Kevin O. Hsu
website: https://modrinth.com/plugin/verymcproto
description: A Paper plugin port of Fabric protocol mods (Servux protocol + JEI server protocol + Syncmatica schematic sharing).
commands:
  servux:
    description: Servux protocol configuration and diagnostics command
    usage: /servux reload|save|set|info|list|enable|disable|search|debug|litematic
    permission: servux.commands
  syncmatica:
    description: Syncmatica schematic sharing command (config management + protocol toggle + .litematic loading)
    usage: /syncmatica status|save|reload|enable|disable|load [file]|debug [...]
    permission: syncmatica.command
  jei:
    description: JEI protocol module command (status / enable-disable module, persisted)
    usage: /jei status|enable|disable
    permission: jei.command
permissions:
  servux.commands:
    description: Allows the /servux command (root node; Bukkit approximation of upstream servux.commands requiring level 4)
    default: op
  servux.commands.reload:
    description: Allows /servux reload
    default: op
  servux.commands.save:
    description: Allows /servux save
    default: op
  servux.commands.set:
    description: Allows /servux set (in-memory change only; use save to persist)
    default: op
  servux.commands.info:
    description: Allows /servux info
    default: op
  servux.commands.list:
    description: Allows /servux list and /servux search (upstream search reuses the list node)
    default: op
  servux.commands.enable:
    description: Allows /servux enable (our extended subcommand, no upstream counterpart)
    default: op
  servux.commands.disable:
    description: Allows /servux disable (our extended subcommand, no upstream counterpart)
    default: op
  servux.commands.debug:
    description: Allows /servux debug (our extended subcommand, no upstream counterpart)
    default: op
  servux.commands.litematic:
    description: Allows /servux litematic (our extended subcommand, no upstream counterpart)
    default: op
  servux.command:
    description: Legacy /servux single node (kept for compatibility; as a parent it inherits the new permission tree, existing grants stay valid)
    default: op
    children:
      servux.commands: true
      servux.commands.reload: true
      servux.commands.save: true
      servux.commands.set: true
      servux.commands.info: true
      servux.commands.list: true
      servux.commands.enable: true
      servux.commands.disable: true
      servux.commands.debug: true
      servux.commands.litematic: true
  syncmatica.command:
    description: Allows the /syncmatica command
    default: true
  jei.command:
    description: Allows the /jei command (status / enable-disable the JEI protocol module)
    default: op
  syncmatica.command.admin:
    description: Allows /syncmatica save|reload|enable|disable|status (config and protocol management)
    default: op
  syncmatica.command.load:
    description: Allows /syncmatica load
    default: true
  syncmatica.command.load_each:
    description: Allows /syncmatica load <file>
    default: true
  syncmatica.command.debug:
    description: Allows /syncmatica debug (debug logging master switch, syncmatica-specific state)
    default: op
