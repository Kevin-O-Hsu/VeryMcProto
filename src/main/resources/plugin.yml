name: VeryMcProto
version: '${version}'
main: verymc.top.veryMcProto.VeryMcProto
api-version: '${mcVersion}'
load: POSTWORLD
softdepend: [packetevents]
author: Kevin O. Hsu
website: https://modrinth.com/plugin/verymcproto
description: A Paper plugin port of Fabric protocol mods (Servux protocol + JEI server protocol + Syncmatica schematic sharing + Carpet foundation rules).
commands:
  servux:
    description: Servux protocol configuration and diagnostics command
    usage: /servux reload|save|set|info|list|enable|disable|search|debug|litematic
    permission: 'servux:command.about'
  syncmatica:
    description: Syncmatica schematic sharing command (config management + protocol toggle + .litematic loading)
    usage: /syncmatica status|save|reload|enable|disable|load [file]|debug [...]
    permission: 'syncmatica:command'
  jei:
    description: JEI protocol module command (status / enable-disable module, persisted)
    usage: /jei status|enable|disable
    permission: jei.command
  carpet:
    description: Carpet mod foundation rule shell (list, query, persist or remove rule defaults)
    usage: /carpet list | setDefault <rule> <value> | query <rule> | removeDefault <rule>
    permission: carpet.command
permissions:
  'servux:command.about':
    description: Allows the /servux command root (upstream permission level 3)
    default: op
  'servux:command.reload':
    description: Allows /servux reload (upstream permission level 4)
    default: op
  'servux:command.save':
    description: Allows /servux save (upstream permission level 4)
    default: op
  'servux:command.set':
    description: Allows /servux set, in-memory change only, use save to persist (upstream permission level 4)
    default: op
  'servux:command.info':
    description: Allows /servux info (upstream permission level 4)
    default: op
  'servux:command.list':
    description: Allows /servux list and /servux search, upstream search reuses the list node (upstream permission level 4)
    default: op
  'servux:command.enable':
    description: Allows /servux enable (our extended subcommand, no upstream counterpart, upstream permission level 4)
    default: op
  'servux:command.disable':
    description: Allows /servux disable (our extended subcommand, no upstream counterpart, upstream permission level 4)
    default: op
  'servux:command.debug':
    description: Allows /servux debug (our extended subcommand, no upstream counterpart, upstream permission level 4)
    default: op
  'servux:command.litematic':
    description: Allows /servux litematic (our extended subcommand, no upstream counterpart, upstream permission level 4)
    default: op
  'syncmatica:command':
    description: Allows the /syncmatica command (upstream permission level 0, all players)
    default: true
  jei.command:
    description: Allows the /jei command (status / enable-disable the JEI protocol module)
    default: op
  'syncmatica:command.admin':
    description: Allows /syncmatica save|reload|enable|disable|status (config and protocol management)
    default: op
  'syncmatica:command.load':
    description: Allows /syncmatica load (upstream permission level 0, all players)
    default: true
  'syncmatica:command.load_each':
    description: Allows /syncmatica load <file> (upstream permission level 0, all players)
    default: true
  'syncmatica:command.debug':
    description: Allows /syncmatica debug (debug logging master switch, syncmatica-specific state)
    default: op
  carpet.command:
    description: Allows the /carpet rule shell (runtime gate additionally enforces the carpetCommandPermissionLevel rule - ops/2/4)
    default: op
