# JUnit Platform 全局测试配置（src/test/resources 在 Gradle 测试运行时类路径上，自动生效）。
# 测试临时目录治理：裸 @TempDir 统一建到 build/tmp/test-tempdir（工厂经系统属性取根目录，
# 根目录由 build.gradle.kts 的 test 任务注入），且全局清理模式置 NEVER——规避 Windows 上
# @TempDir 清理与"刚写完的文件"的句柄竞态（首跑偶发失败、重跑即过）。
# 两个键名均经 junit-jupiter-engine-5.10.2.jar 的 DefaultJupiterConfiguration 字节码核实。
junit.jupiter.tempdir.factory.default=verymc.top.veryMcProto.BuildDirTempDirFactory
junit.jupiter.tempdir.cleanup.mode.default=NEVER
